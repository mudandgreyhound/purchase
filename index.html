<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Summary — Greyhound Group</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5;
    --ink:#1a1d21; --ink-2:#5a626b; --muted:#9aa2ab; --border:#e3e6ea;
    /* categorical (fixed order — ห้าม cycle): blue, orange, teal, magenta, gold
       ผ่าน CVD validator (deutan/tritan ΔE OK) */
    --c1:#3b6fb0; --c2:#d97b2e; --c3:#2a9d8f; --c4:#b5478f; --c5:#c9a227;
    --accent:#3b6fb0;
  }
  :root[data-theme="dark"]{
    --bg:#15181c; --surface:#1e2228; --surface-2:#262b31;
    --ink:#e8eaed; --ink-2:#aab2bb; --muted:#6b737c; --border:#2e343b;
    /* categorical คงชุดเดียวกับ light (ผ่าน CVD + contrast บน dark surface) */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181c; --surface:#1e2228; --surface-2:#262b31;
      --ink:#e8eaed; --ink-2:#aab2bb; --muted:#6b737c; --border:#2e343b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;margin-bottom:16px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
  select,button{font:inherit;padding:7px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
  input{font:inherit;padding:7px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* date range */
  .daterange{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:4px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
  .daterange input[type=date]{padding:5px 8px;font-size:13px}
  .daterange .sep{color:var(--ink-2)}
  .preset{padding:5px 10px;font-size:12px;font-weight:600;background:var(--surface);
    color:var(--ink-2);border:1px solid var(--border)}
  .preset.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daterange .lbl{font-size:12px;color:var(--ink-2);font-weight:600}
  /* tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border)}
  .tab{padding:8px 16px;border:none;background:none;color:var(--ink-2);cursor:pointer;
    font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  /* overdue badge */
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .badge.over{background:var(--c4);color:#fff}
  .badge.soon{background:var(--c2);color:#fff}
  .badge.ok{background:var(--surface-2);color:var(--ink-2)}
  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px}
  .kpi .label{color:var(--ink-2);font-size:12px;margin-bottom:6px}
  .kpi .value{font-size:24px;font-weight:700;letter-spacing:-0.5px}
  .kpi .unit{font-size:13px;color:var(--muted);font-weight:400}
  .kpi.mom .value.up{color:var(--c4)} .kpi.mom .value.down{color:var(--c5)}
  /* panels */
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.grid.two{grid-template-columns:3fr 2fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px}
  .panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
  .chart-box{position:relative;height:300px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--ink-2);font-weight:600;font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar-cell{position:relative}
  .bar-cell .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:60%;background:var(--c1);opacity:.15;border-radius:4px}
  .loading{color:var(--muted);padding:40px;text-align:center}
  .err{color:var(--c4);padding:16px;background:var(--surface-2);border-radius:8px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
    vertical-align:middle}
  /* clickable supplier row */
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--surface-2)}
  .click-hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
  /* modal overlay (drill-down) */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:820px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-head .msub{font-size:12px;color:var(--ink-2);margin-top:3px}
  .modal-x{border:none;background:var(--surface-2);border-radius:8px;padding:6px 11px;
    font-size:16px;line-height:1;cursor:pointer;color:var(--ink)}
  .modal-body{padding:16px 20px;max-height:62vh;overflow-y:auto}
  /* login gate */
  .gate{position:fixed;inset:0;z-index:100;background:var(--bg);
    display:none;align-items:center;justify-content:center;padding:20px}
  .gate.show{display:flex}
  .gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .gate-card h1{font-size:20px;margin:0 0 4px}
  .gate-card .sub{margin-bottom:20px}
  .gate-card label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px;font-weight:600}
  .gate-card input{width:100%;box-sizing:border-box}
  .gate-card button.primary,.btn-primary{width:100%;margin-top:18px;background:var(--accent);
    color:#fff;border:none;font-weight:600;padding:10px}
  .btn-primary{width:auto;margin:0}
  .gate-err{color:var(--c4);font-size:13px;margin-top:12px;min-height:16px}
  /* user chip */
  #userBox{display:flex;gap:6px;align-items:center}
  .uchip{font-size:13px;color:var(--ink-2);padding:6px 10px;background:var(--surface-2);
    border-radius:8px;display:flex;align-items:center;gap:6px}
  .uchip .role{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;
    background:var(--accent);color:#fff}
  .iconbtn{padding:6px 10px;font-size:13px}
  /* admin users table */
  .umodal input,.umodal select{padding:6px 9px;font-size:13px}
  .brandchks{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .brandchks label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
  .addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;
    margin-bottom:14px;padding:14px;background:var(--surface-2);border-radius:10px}
  .addrow .full{grid-column:1/-1}
  .mini{padding:4px 9px;font-size:12px}
  .mini.danger{color:var(--c4);border-color:var(--c4)}
  /* exec KPI */
  .exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .exec-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 20px}
  .exec-card .ex-label{font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:10px}
  .exec-card .ex-value{font-size:34px;font-weight:700;letter-spacing:-0.5px;line-height:1.1}
  .exec-card .ex-sub{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  .exec-card.clickable-card{cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .exec-card.clickable-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .rm-item{background:var(--surface-2);border-radius:10px;padding:14px}
  .rm-item b{font-size:13px}
  .rm-item span{display:block;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
  .rm-item em{display:block;font-size:11px;color:var(--muted);font-style:normal}
</style>
</head>
<body>

<!-- ===== login gate ===== -->
<div class="gate" id="loginGate">
  <div class="gate-card">
    <h1>Purchase Dashboard</h1>
    <div class="sub">Greyhound Group · เข้าสู่ระบบ</div>
    <form id="loginForm">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="loginUser" autocomplete="username" autofocus>
      <label>รหัสผ่าน</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <button type="submit" class="primary" id="loginBtn">เข้าสู่ระบบ</button>
      <div class="gate-err" id="loginErr"></div>
    </form>
  </div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1 id="pageTitle">Purchase Dashboard — จัดซื้อ</h1>
      <div class="sub">Greyhound Group · ข้อมูลจาก AX 4.0 → MySQL</div>
    </div>
    <div class="toolbar">
      <select id="brandSel"></select>
      <span class="daterange">
        <span class="lbl">📅</span>
        <input type="date" id="dFrom" title="วันที่เริ่ม">
        <span class="sep">–</span>
        <input type="date" id="dTo" title="วันที่สิ้นสุด">
        <button class="preset" data-preset="month">เดือนนี้</button>
        <button class="preset" data-preset="3m">3 เดือน</button>
        <button class="preset" data-preset="year">ปีนี้</button>
        <button class="preset active" data-preset="all">ทั้งหมด</button>
      </span>
      <span id="userBox" style="display:none"></span>
      <button id="themeBtn" title="สลับโหมดสี">🌓</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="exec">ภาพรวมผู้บริหาร</button>
    <button class="tab" data-tab="summary">สรุปยอดจัดซื้อ</button>
    <button class="tab" data-tab="outstanding">PO ค้างรับ</button>
    <button class="tab" data-tab="price">วิเคราะห์ราคา</button>
    <button class="tab" data-tab="supplier">ประเมินผู้ขาย</button>
  </div>

  <div id="app"><div class="loading">กำลังโหลดข้อมูล…</div></div>
</div>

<!-- modal drill-down: ผู้ขายรายนี้ซื้ออะไรบ้าง -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">—</h3>
        <div class="msub" id="modalSub"></div>
      </div>
      <button class="modal-x" id="modalX" title="ปิด">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- modal: เปลี่ยนรหัสผ่าน -->
<div class="modal-bg" id="pwBg">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <div><h3 id="pwTitle">เปลี่ยนรหัสผ่าน</h3>
        <div class="msub" id="pwSub"></div></div>
      <button class="modal-x" id="pwX" title="ปิด">✕</button>
    </div>
    <div class="modal-body">
      <label style="font-size:13px;color:var(--ink-2);font-weight:600">รหัสผ่านเดิม</label>
      <input type="password" id="pwOld" style="width:100%;box-sizing:border-box;margin:4px 0 12px">
      <label style="font-size:13px;color:var(--ink-2);font-weight:600">รหัสผ่านใหม่ (≥6 ตัว)</label>
      <input type="password" id="pwNew" style="width:100%;box-sizing:border-box;margin:4px 0 12px">
      <button class="btn-primary" id="pwSave">บันทึก</button>
      <div class="gate-err" id="pwErr"></div>
    </div>
  </div>
</div>

<!-- modal: จัดการผู้ใช้ (admin) -->
<div class="modal-bg umodal" id="usersBg">
  <div class="modal">
    <div class="modal-head">
      <div><h3>จัดการผู้ใช้</h3>
        <div class="msub">กำหนดสิทธิ์การเข้าถึงตามแบรนด์ · admin เห็นทุกแบรนด์</div></div>
      <button class="modal-x" id="usersX" title="ปิด">✕</button>
    </div>
    <div class="modal-body" id="usersBody"></div>
  </div>
</div>

<script>
// ===== config =====
const API = "https://purchase-api.mobile1234.site";
const CAT = ["--c1","--c2","--c3","--c4","--c5"].map(v=>
  getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const fmtB = n => "฿" + Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0});
const fmtN = n => Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0});
let charts = {};

let currentTab = "exec";

// ===== theme toggle =====
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{localStorage.setItem("pa-theme", next)}catch(e){}
  if (lastBrand) load(lastBrand);  // re-render ให้สีตรง theme
};
try{const t=localStorage.getItem("pa-theme"); if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

// ===== tab switching =====
document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    if(lastBrand) load(lastBrand);
  };
});

// ===== date range (global) =====
let dateRange = {from:null, to:null};   // null = ทั้งหมด (ไม่กรอง)

function isoLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function nextDay(s){            // backend ใช้ date_to < %s → บวก 1 วันให้ครอบคลุมวันสุดท้าย
  const [y,m,d]=s.split("-").map(Number);
  return isoLocal(new Date(y, m-1, d+1));
}
// ต่อท้าย query string ให้ endpoint ที่กรองวันที่ได้
function dp(){
  let s="";
  if(dateRange.from) s += "&date_from="+dateRange.from;
  if(dateRange.to)   s += "&date_to="+nextDay(dateRange.to);
  return s;
}
function syncDateInputs(){
  document.getElementById("dFrom").value = dateRange.from || "";
  document.getElementById("dTo").value   = dateRange.to   || "";
}
function markPreset(p){
  document.querySelectorAll(".preset").forEach(b=>
    b.classList.toggle("active", b.dataset.preset===p));
}
function setPreset(p){
  const now = new Date();
  if(p==="month"){
    dateRange.from = isoLocal(new Date(now.getFullYear(), now.getMonth(), 1));
    dateRange.to   = isoLocal(now);
  } else if(p==="3m"){
    const f = new Date(now); f.setMonth(f.getMonth()-3);
    dateRange.from = isoLocal(f); dateRange.to = isoLocal(now);
  } else if(p==="year"){
    dateRange.from = isoLocal(new Date(now.getFullYear(),0,1));
    dateRange.to   = isoLocal(now);
  } else {  // all
    dateRange.from = null; dateRange.to = null;
  }
  syncDateInputs(); markPreset(p);
  if(lastBrand) load(lastBrand);
}
document.querySelectorAll(".preset").forEach(b=>{
  b.onclick = () => setPreset(b.dataset.preset);
});
// พิมพ์วันเองในช่อง → ล้าง preset active แล้วโหลดใหม่
["dFrom","dTo"].forEach(id=>{
  document.getElementById(id).onchange = () => {
    dateRange.from = document.getElementById("dFrom").value || null;
    dateRange.to   = document.getElementById("dTo").value   || null;
    markPreset(dateRange.from||dateRange.to ? "" : "all");
    if(lastBrand) load(lastBrand);
  };
});

// ===== auth state =====
let authToken=null, authUser=null;
try{ authToken=localStorage.getItem("pa-token"); authUser=JSON.parse(localStorage.getItem("pa-user")||"null"); }catch(e){}

// ===== fetch helper (แนบ token + จัดการ error) =====
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers||{});
  if(authToken) headers["Authorization"] = "Bearer "+authToken;
  const r = await fetch(API + path, Object.assign({}, opts, {headers}));
  if(r.status===401){ doLogout("หมดเวลาเข้าสู่ระบบ — กรุณาเข้าสู่ระบบใหม่"); throw new Error("unauthorized"); }
  if(!r.ok){
    let msg = path+" → "+r.status;
    try{ const j=await r.json(); if(j && j.detail) msg = (typeof j.detail==="string")?j.detail:JSON.stringify(j.detail); }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}
async function apiSend(path, method, body){
  return api(path, {method, headers:{"Content-Type":"application/json"},
                    body: body!==undefined ? JSON.stringify(body) : undefined});
}

let lastBrand = null;

async function initBrands(){
  const sel = document.getElementById("brandSel");
  try{
    const bs = await api("/api/brands");
    sel.innerHTML = bs.map(b=>`<option value="${b.brand_code}">${b.brand_name}</option>`).join("");
    sel.onchange = () => load(sel.value);
    load(sel.value || "GHC");
  }catch(e){
    document.getElementById("app").innerHTML =
      `<div class="err">เชื่อมต่อ API ไม่ได้: ${e.message}<br>เช็กว่า backend รันที่ ${API} แล้ว</div>`;
  }
}

// dispatch ตามแท็บที่เลือก
async function load(brand){
  if(currentTab==="exec") return loadExec(brand);
  if(currentTab==="outstanding") return loadOutstanding(brand);
  if(currentTab==="price") return loadPrice(brand);
  if(currentTab==="supplier") return loadSupplier(brand);
  return loadSummary(brand);
}

async function loadSummary(brand){
  lastBrand = brand;
  catDrill = null;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลด ${brand}…</div>`;
  try{
    const [kpi, mom, monthly, cats, sups, locs, catDetail, supSku] = await Promise.all([
      api(`/api/summary/kpi?brand=${brand}${dp()}`),
      api(`/api/summary/mom?brand=${brand}`),
      api(`/api/summary/monthly?brand=${brand}${dp()}`),
      api(`/api/summary/by-category?brand=${brand}${dp()}`),
      api(`/api/summary/by-supplier?brand=${brand}&limit=15${dp()}`),
      api(`/api/summary/by-location?brand=${brand}${dp()}`),
      api(`/api/summary/category-detail?brand=${brand}${dp()}`),
      api(`/api/summary/supplier-sku?brand=${brand}&limit=15${dp()}`),
    ]);
    render(app, {kpi, mom, monthly, cats, sups, locs, catDetail, supSku});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function render(app, d){
  const momUp = d.mom.pct_change > 0;
  app.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">ยอดซื้อรวม</div>
        <div class="value">${fmtB(d.kpi.total_purchase)}</div></div>
      <div class="kpi"><div class="label">จำนวน PO</div>
        <div class="value">${fmtN(d.kpi.po_count)} <span class="unit">ใบ</span></div></div>
      <div class="kpi"><div class="label">Supplier</div>
        <div class="value">${fmtN(d.kpi.supplier_count)} <span class="unit">ราย</span></div></div>
      <div class="kpi"><div class="label">รายการสินค้า</div>
        <div class="value">${fmtN(d.kpi.item_count)} <span class="unit">SKU</span></div></div>
      <div class="kpi mom"><div class="label">เทียบเดือนก่อน (${d.mom.current_month||'-'})</div>
        <div class="value ${momUp?'up':'down'}">
          ${d.mom.pct_change==null?'-':(momUp?'▲':'▼')+' '+Math.abs(d.mom.pct_change)+'%'}</div></div>
    </div>

    <div class="grid two">
      <div class="panel">

// คำอธิบายแต่ละหมวด (ภาษาไทย) — แยกจาก prefix ของรหัสสินค้าใน AX
const CAT_DESC = {
  "Goods":   "วัตถุดิบ/สินค้าที่ซื้อมาใช้ในธุรกิจ",
  "Expense": "ค่าใช้จ่าย (ไม่ใช่ของขาย)",
  "Capex":   "สินทรัพย์ถาวร/ของลงทุน",
  "(none)":  "ไม่ระบุหมวด",
};

let catRows = [];        // เก็บ raw (category+item_group) ไว้ทำ drill-down
let catDrill = null;     // category ที่กำลัง drill อยู่ (null = ระดับบน)

function drawCategory(rows){
  if(rows) catRows = rows;          // ครั้งแรกเก็บไว้; เรียกซ้ำตอน drill ไม่ส่ง rows
  const drilling = catDrill !== null;
  const hint = document.getElementById("catDrillHint");

  // ระดับบน: รวมตาม category | ระดับ drill: เฉพาะ item_group ใน category นั้น
  const agg={};
  catRows.forEach(r=>{
    if(drilling){
      if(r.category===catDrill) agg[r.item_group]=(agg[r.item_group]||0)+(+r.purchase_amount);
    }else{
      agg[r.category]=(agg[r.category]||0)+(+r.purchase_amount);
    }
  });
  const labels=Object.keys(agg).sort((a,b)=>agg[b]-agg[a]);
  const data=labels.map(k=>agg[k]);
  const total = data.reduce((a,b)=>a+b,0) || 1;

  if(hint) hint.textContent = drilling
    ? `▸ ${catDrill} — คลิกเพื่อย้อนกลับ` : "คลิกที่วงเพื่อดูหมวดย่อย";

  if(charts.cat) charts.cat.destroy();
  const ctx=document.getElementById("catChart");
  charts.cat=new Chart(ctx,{
    type:"doughnut",
    data:{ labels, datasets:[{ data,
      backgroundColor:labels.map((_,i)=>CAT[i%CAT.length]),
      borderColor:getComputedStyle(document.documentElement).getPropertyValue("--surface").trim(),
      borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:(e,els)=>{
        if(drilling){ catDrill=null; drawCategory(); return; }   // คลิกตอน drill = ย้อนกลับ
        if(els.length){ catDrill=labels[els[0].index]; drawCategory(); }  // คลิก slice = drill เข้า
      },
      plugins:{
        legend:{position:"bottom",labels:{color:inkColor(),boxWidth:12,padding:10,font:{size:11},
          generateLabels:(chart)=>{
            const ds=chart.data.datasets[0];
            return chart.data.labels.map((lb,i)=>({
              text:`${lb} ${(ds.data[i]/total*100).toFixed(1)}%`,
              fillStyle:ds.backgroundColor[i], strokeStyle:ds.backgroundColor[i], index:i,
            }));
          }}},
        tooltip:{ callbacks:{
          title:c=>c[0].label,
          label:c=>" "+fmtB(c.parsed)+"  ("+(c.parsed/total*100).toFixed(1)+"%)",
          afterLabel:c=>drilling?"":(CAT_DESC[c.label]||""),
        }}}}
  });

  // คำอธิบายใต้กราฟ (เฉพาะระดับบน — บอก Goods/Expense/Capex คืออะไร)
  const box=document.getElementById("catLegend");
  if(box){
    if(drilling){
      box.innerHTML = labels.slice(0,8).map((lb,i)=>`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <span class="dot" style="background:${CAT[i%CAT.length]}"></span>
          <span style="flex:1">${lb}</span>
          <b>${fmtB(agg[lb])}</b>
          <span style="color:var(--muted);width:48px;text-align:right">${(agg[lb]/total*100).toFixed(1)}%</span>
        </div>`).join("");
    }else{
      box.innerHTML = labels.map((lb,i)=>`
        <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px">
          <span class="dot" style="background:${CAT[i%CAT.length]};margin-top:4px"></span>
          <div><b>${lb}</b> — ${fmtB(agg[lb])} (${(agg[lb]/total*100).toFixed(1)}%)
            <div style="color:var(--muted);font-size:12px">${CAT_DESC[lb]||""}</div></div>
        </div>`).join("");
    }
  }
}

function odBadge(od){

  if(od>0)  return `<span class="badge soon">เกิน ${od} วัน</span>`;

function fillPoList(rows){
  const body=document.getElementById("poListBody");
  if(!rows||!rows.length){body.innerHTML=`<tr><td colspan="9" style="color:var(--muted)">ไม่มี PO ค้างรับ 🎉</td></tr>`;return;}
  // จัดกลุ่มตาม purch_id (คงลำดับที่ backend เรียงมา = เกินกำหนดมากสุดก่อน)
  const groups=new Map();
  rows.forEach(r=>{ if(!groups.has(r.purch_id)) groups.set(r.purch_id,[]); groups.get(r.purch_id).push(r); });

  let html="";
  for(const [po, lines] of groups){
    const g0=lines[0];
    const worstOd=Math.max(...lines.map(l=>l.days_overdue));
    const earliest=lines.map(l=>l.delivery_date).filter(Boolean).sort()[0]||'-';
    const sumVal=lines.reduce((a,l)=>a+(+l.outstanding_value||0),0);
    const statuses=new Set(lines.map(l=>l.purch_status));
    const stTxt = statuses.size>1 ? "ผสม" : (PO_ST[g0.purch_status]||g0.purch_status);
    const multi = lines.length>1;
    // แถวหลัก (ราย PO)
    html+=`<tr class="po-parent" data-po="${po}" style="cursor:pointer">
      <td><span class="po-tog">${multi?'▸':'•'}</span> ${po}${multi?` <span style="color:var(--muted);font-size:11px">(${lines.length})</span>`:''}</td>
      <td style="color:var(--ink-2);max-width:280px">${multi?lines.length+' รายการ':`<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${((g0.line_text||g0.item_name)||'').replace(/"/g,'&quot;')}">${g0.item_id} ${(g0.line_text||g0.item_name||'')}</div>`}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g0.vendor_name||g0.vendor_acct||''}</td>
      <td title="${(g0.location_name||'').replace(/"/g,'')}">${g0.invent_location||'-'}</td>
      <td class="num">${earliest}<br>${odBadge(worstOd)}</td>
      <td class="num">${multi?'—':fmtN(g0.qty_ordered)}</td>
      <td class="num">${multi?'—':`<b>${fmtN(g0.remain_physical)}</b>`}</td>
      <td class="num"><b>${fmtB(sumVal)}</b></td>
      <td class="num">${stTxt}</td>
    </tr>`;
    // แถวย่อย (รายบรรทัด) — ซ่อนไว้ กางเมื่อคลิก (เฉพาะ PO ที่มีหลายรายการ)
    if(multi){
      lines.forEach(l=>{
        html+=`<tr class="po-child" data-parent="${po}" hidden style="background:var(--surface-2)">
          <td></td>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:18px" title="${((l.line_text||l.item_name)||'').replace(/"/g,'')}">${l.item_id} ${(l.line_text||l.item_name||'')}</td>
          <td></td>
          <td>${l.invent_location||''}</td>
          <td class="num">${l.delivery_date||'-'}<br>${odBadge(l.days_overdue)}</td>
          <td class="num">${fmtN(l.qty_ordered)}</td>
          <td class="num"><b>${fmtN(l.remain_physical)}</b></td>
          <td class="num">${fmtB(l.outstanding_value)}</td>
          <td class="num">${PO_ST[l.purch_status]||l.purch_status}</td>
        </tr>`;
      });
    }
  }
  body.innerHTML=html;
  // toggle กาง/ยุบ
  body.querySelectorAll("tr.po-parent").forEach(tr=>{
    const po=tr.dataset.po;
    const kids=body.querySelectorAll(`tr.po-child[data-parent="${po}"]`);
    if(!kids.length) return;
    tr.onclick=()=>{
      const tog=tr.querySelector(".po-tog");
      const open=tog.textContent==="▾";
      tog.textContent=open?"▸":"▾";
      kids.forEach(k=>k.hidden=open);
    };
  });
}

let priceDir = "all";     // ทิศทางที่กรองในตารางราคาเปลี่ยนแปลง
let priceGroup = "";      // หมวด (item_group) ที่กรอง — "" = ทุกหมวด

async function loadPrice(brand){
  lastBrand = brand;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลดราคา ${brand}…</div>`;
  const grp = priceGroup ? `&group=${encodeURIComponent(priceGroup)}` : "";
  try{
    const [changes, summary, groups] = await Promise.all([
      api(`/api/price/changes?brand=${brand}&direction=${priceDir}&limit=50${grp}${dp()}`),
      api(`/api/price/summary?brand=${brand}&limit=100${grp}${dp()}`),
      api(`/api/price/groups?brand=${brand}${dp()}`),
    ]);
    renderPrice(app, {brand, changes, summary, groups});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function renderPrice(app, d){
  app.innerHTML = `
    <div class="panel">

          <button class="tab ${priceDir==='all'?'active':''}" data-dir="all" style="padding:3px 10px;font-size:12px">ทั้งหมด</button>
          <button class="tab ${priceDir==='up'?'active':''}" data-dir="up" style="padding:3px 10px;font-size:12px">ขึ้น ▲</button>
          <button class="tab ${priceDir==='down'?'active':''}" data-dir="down" style="padding:3px 10px;font-size:12px">ลง ▼</button>
          <select id="priceGrpSel" style="margin-left:8px;padding:4px 8px;font-size:12px">
            <option value="">ทุกหมวด</option>
            ${(d.groups||[]).map(g=>`<option value="${g.item_group}" ${g.item_group===priceGroup?'selected':''}>${g.item_group}${g.item_group_name?' — '+g.item_group_name:''} (${g.sku_count})</option>`).join("")}
          </select>
        </span>
      </h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>สินค้า</th><th>หมวด</th><th class="num">ราคาก่อน</th>
        <th class="num">ราคาล่าสุด</th><th class="num">เปลี่ยน</th><th class="num">%</th>
        <th class="num">วันล่าสุด</th>
      </tr></thead><tbody id="priceChgBody"></tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>สรุปราคาวัตถุดิบ (ล่าสุด / เฉลี่ย / มาตรฐาน)
        <span style="font-weight:400;font-size:12px;color:var(--muted);margin-left:8px">คลิกสินค้าเพื่อเทียบราคาระหว่าง supplier</span>

      <table><thead><tr>
        <th>สินค้า</th><th>หมวด</th><th class="num">หน่วย</th>
        <th class="num">ราคาล่าสุด</th><th class="num">เฉลี่ย</th>
        <th class="num">มาตรฐาน</th><th class="num">vs มาตรฐาน</th>
        <th class="num">Supplier</th>
      </tr></thead><tbody id="priceSumBody"></tbody></table>
      </div>
    </div>

    <div class="panel" id="supCmpPanel" style="margin-top:16px;display:none">
      <h2 id="supCmpTitle">เทียบราคาระหว่าง Supplier</h2>

      <table><thead><tr>
        <th>Supplier</th><th class="num">ราคาเฉลี่ย</th><th class="num">ต่ำสุด</th>
        <th class="num">สูงสุด</th><th class="num">ครั้งที่ซื้อ</th><th class="num">ซื้อล่าสุด</th>
      </tr></thead><tbody id="supCmpBody"></tbody></table>

  // ปุ่มกรองทิศทาง
  document.querySelectorAll("[data-dir]").forEach(b=>{

  if(gsel) gsel.onchange=()=>{ priceGroup=gsel.value; loadPrice(lastBrand); };

const fmtP = n => Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});

function fillPriceChanges(rows){
  const body=document.getElementById("priceChgBody");
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="7" style="color:var(--muted)">ไม่มีรายการราคาเปลี่ยน</td></tr>`; return; }
  body.innerHTML=rows.map(r=>{
    const pct=+r.pct_change||0, up=pct>0;
    const badge=`<span class="badge ${up?'over':'ok'}" style="${up?'':'background:var(--c5);color:#fff'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
    const lt=(r.line_text||'').trim();
    const showLt = lt && lt!==(r.item_name||'').trim();
    return `<tr>
      <td style="max-width:260px">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.item_name||'').replace(/"/g,'')}">${r.item_id} ${r.item_name||''}</div>
        ${showLt?`<div style="font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${lt.replace(/"/g,'')}">↳ ${lt}</div>`:''}
      </td>
      <td>${r.item_group||'-'}</td>
      <td class="num">฿${fmtP(r.prev_price)}</td>
      <td class="num"><b>฿${fmtP(r.latest_price)}</b></td>
      <td class="num" style="color:${up?'var(--c4)':'var(--c5)'}">${up?'+':''}${fmtP(r.diff)}</td>
      <td class="num">${badge}</td>
      <td class="num">${r.latest_date||'-'}</td>
    </tr>`;
  }).join("");
}

function fillPriceSummary(rows, brand){
  const body=document.getElementById("priceSumBody");
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="8" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
  body.innerHTML=rows.map(r=>{
    const std=+r.standard_price||0, latest=+r.latest_price||0;
    let vsStd='-';
    if(std>0 && latest>0){
      const diff=(latest-std)/std*100;
      const over=diff>0;
      vsStd=`<span style="color:${over?'var(--c4)':'var(--c5)'}">${over?'+':''}${diff.toFixed(1)}%</span>`;
    }
    return `<tr style="cursor:pointer" data-item="${r.item_id}" data-name="${(r.item_name||'').replace(/"/g,'')}">
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.item_name||'').replace(/"/g,'')}">${r.item_id} ${r.item_name||''}</td>
      <td>${r.item_group||'-'}</td>
      <td class="num">${r.purch_unit||'-'}</td>
      <td class="num"><b>฿${fmtP(r.latest_price)}</b></td>
      <td class="num">฿${fmtP(r.avg_price)}</td>
      <td class="num">${std>0?'฿'+fmtP(std):'-'}</td>
      <td class="num">${vsStd}</td>
      <td class="num">${fmtN(r.vendor_count)} ราย</td>
    </tr>`;
  }).join("");
  // คลิกแถว -> เทียบ supplier
  body.querySelectorAll("tr[data-item]").forEach(tr=>{
    tr.onclick=()=>showSupplierCompare(brand, tr.dataset.item, tr.dataset.name);
  });
}

async function showSupplierCompare(brand, itemId, itemName){
  const panel=document.getElementById("supCmpPanel");
  const body=document.getElementById("supCmpBody");
  document.getElementById("supCmpTitle").textContent=`เทียบราคา: ${itemId} ${itemName||''}`;
  panel.style.display="block";
  body.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">กำลังโหลด…</td></tr>`;
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
  try{
    const rows=await api(`/api/price/by-supplier?brand=${brand}&item_id=${encodeURIComponent(itemId)}`);
    if(!rows.length){ body.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
    const minP=Math.min(...rows.map(r=>+r.avg_price));
    body.innerHTML=rows.map(r=>{
      const cheapest=(+r.avg_price===minP);
      return `<tr>
        <td>${r.vendor_name}${cheapest?' <span class="badge" style="background:var(--c5);color:#fff">ถูกสุด</span>':''}</td>
        <td class="num"><b>฿${fmtP(r.avg_price)}</b></td>
        <td class="num">฿${fmtP(r.min_price)}</td>
        <td class="num">฿${fmtP(r.max_price)}</td>
        <td class="num">${fmtN(r.buy_count)}</td>
        <td class="num">${r.last_buy||'-'}</td>
      </tr>`;
    }).join("");
  }catch(e){
    body.innerHTML=`<tr><td colspan="6" class="err">${e.message}</td></tr>`;
  }
}

//  SUPPLIER PERFORMANCE (มุมที่ 4) — ประเมินผู้ขาย
// =============================================================================
let supSort = "spend";   // spend / ontime / lead / return

async function loadSupplier(brand){
  lastBrand = brand;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังประเมินผู้ขาย ${brand}…</div>`;
  try{
    const [kpi, perf] = await Promise.all([
      api(`/api/supplier/kpi?brand=${brand}${dp()}`),
      api(`/api/supplier/performance?brand=${brand}&limit=50&sort=${supSort}${dp()}`),
    ]);
    renderSupplier(app, {brand, kpi, perf});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function renderSupplier(app, d){
  const k = d.kpi;
  const otTxt = k.ontime_rate==null ? "—" : k.ontime_rate.toFixed(1)+"%";
  const ldTxt = k.avg_lead_days==null ? "—" : fmtN(k.avg_lead_days)+" วัน";
  app.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">ผู้ขายที่มีการรับของ</div>
        <div class="value">${fmtN(k.supplier_count)} <span class="unit">ราย</span></div></div>
      <div class="kpi"><div class="label">ส่งตรงเวลา (on-time)</div>
        <div class="value" style="color:${k.ontime_rate==null?'var(--ink)':(k.ontime_rate>=90?'var(--c3)':k.ontime_rate>=75?'var(--c2)':'var(--c4)')}">${otTxt}</div>
        <div class="unit">${fmtN(k.ontime_lines)}/${fmtN(k.due_lines)} บรรทัดมีกำหนด</div></div>
      <div class="kpi"><div class="label">Lead time เฉลี่ย</div>
        <div class="value">${ldTxt}</div>
        <div class="unit">วันสั่ง → รับจริง</div></div>
      <div class="kpi"><div class="label">มูลค่าคืน/ตีกลับ</div>
        <div class="value" style="color:${(+k.return_value>0)?'var(--c4)':'var(--ink)'}">${fmtB(k.return_value)}</div>
        <div class="unit">จากรับเข้า ${fmtB(k.recv_value)}</div></div>
    </div>

    <div class="grid two">
      <div class="panel">
        <h2>On-time delivery — ผู้ขายรายใหญ่ (% ส่งตรงเวลา)</h2>
        <div class="chart-box" style="height:300px"><canvas id="supOtChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>Lead time เฉลี่ย (วัน) — ผู้ขายรายใหญ่</h2>
        <div class="chart-box" style="height:300px"><canvas id="supLdChart"></canvas></div>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>ตารางประเมินผู้ขาย
        <span style="font-weight:400;font-size:12px;margin-left:8px">เรียงตาม:
          <button class="tab ${supSort==='spend'?'active':''}" data-sort="spend" style="padding:3px 10px;font-size:12px">มูลค่าซื้อ</button>
          <button class="tab ${supSort==='ontime'?'active':''}" data-sort="ontime" style="padding:3px 10px;font-size:12px">ตรงเวลาแย่สุด</button>
          <button class="tab ${supSort==='lead'?'active':''}" data-sort="lead" style="padding:3px 10px;font-size:12px">Lead time นานสุด</button>
          <button class="tab ${supSort==='return'?'active':''}" data-sort="return" style="padding:3px 10px;font-size:12px">คืนมากสุด</button>
        </span>
      </h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>ผู้ขาย</th>
        <th class="num">มูลค่าซื้อ</th><th class="num">ส่วนแบ่ง</th>
        <th class="num">On-time</th><th class="num">Lead time</th>
        <th class="num">บรรทัดรับ</th><th class="num">คืน/ตีกลับ</th>
      </tr></thead><tbody id="supBody"></tbody></table>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">
        * On-time นับเฉพาะบรรทัดที่มีวันกำหนดส่ง (ยืนยัน/กำหนด) เทียบกับวันรับจริงล่าสุด ·
        Lead time = วันสั่งซื้อ → วันรับจริง · คืน/ตีกลับ = รายการรับที่จำนวนติดลบ

  // ปุ่มเรียงตาราง

function drawSupplierCharts(rows){
  // เลือกรายใหญ่สุด 12 รายตามมูลค่าซื้อ สำหรับกราฟ
  const top = [...rows].sort((a,b)=>(+b.recv_value)-(+a.recv_value)).slice(0,12);
  const names = top.map(r=> (r.vendor_name||r.vendor_acct).length>22
    ? (r.vendor_name||r.vendor_acct).slice(0,22)+"…" : (r.vendor_name||r.vendor_acct));
  const c1 = getComputedStyle(document.documentElement).getPropertyValue("--c1").trim();
  const c3 = getComputedStyle(document.documentElement).getPropertyValue("--c3").trim();
  const c4 = getComputedStyle(document.documentElement).getPropertyValue("--c4").trim();
  const c2 = getComputedStyle(document.documentElement).getPropertyValue("--c2").trim();

  // on-time %
  const ot = top.map(r=> r.ontime_rate==null ? null : +(+r.ontime_rate).toFixed(1));
  const otColors = ot.map(v=> v==null?'#ccc' : v>=90?c3 : v>=75?c2 : c4);
  if(charts.supOt) charts.supOt.destroy();
  charts.supOt = new Chart(document.getElementById("supOtChart"),{
    type:"bar",
    data:{labels:names,datasets:[{data:ot,backgroundColor:otColors,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.parsed.x==null?" ไม่มีกำหนดส่ง":" ส่งตรงเวลา "+c.parsed.x+"%"}}},
      scales:{x:{min:0,max:100,grid:{color:gridColor()},ticks:{color:inkColor(),callback:v=>v+"%"}},
        y:{grid:{display:false},ticks:{color:inkColor(),font:{size:11}}}}}
  });

  // lead time (วัน)
  const ld = top.map(r=> r.avg_lead==null ? null : Math.round(+r.avg_lead));
  if(charts.supLd) charts.supLd.destroy();
  charts.supLd = new Chart(document.getElementById("supLdChart"),{
    type:"bar",
    data:{labels:names,datasets:[{data:ld,backgroundColor:c1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.parsed.x==null?" ไม่มีข้อมูลรับ":" เฉลี่ย "+c.parsed.x+" วัน"}}},
      scales:{x:{grid:{color:gridColor()},ticks:{color:inkColor(),callback:v=>v+" วัน"}},
        y:{grid:{display:false},ticks:{color:inkColor(),font:{size:11}}}}}
  });
}

function fillSupplierTable(rows){
  const body = document.getElementById("supBody");
  if(!rows||!rows.length){body.innerHTML=`<tr><td colspan="7" style="color:var(--muted)">ไม่มีข้อมูลในช่วงที่เลือก</td></tr>`;return;}
  const max = Math.max(...rows.map(r=>+r.recv_value),1);
  body.innerHTML = rows.map(r=>{
    const ot = r.ontime_rate;
    const otCell = ot==null ? `<span style="color:var(--muted)">—</span>`
      : `<span style="color:${ot>=90?'var(--c3)':ot>=75?'var(--c2)':'var(--c4)'};font-weight:600">${(+ot).toFixed(0)}%</span>`;
    const ld = r.avg_lead==null ? `<span style="color:var(--muted)">—</span>` : `${Math.round(+r.avg_lead)} วัน`;
    const retPct = r.return_rate==null ? 0 : +r.return_rate;
    const retCell = (+r.return_value>0)
      ? `${fmtB(r.return_value)} <span style="color:var(--c4);font-size:11px">(${retPct.toFixed(1)}%)</span>`
      : `<span style="color:var(--muted)">—</span>`;
    return `<tr class="clickable" data-acct="${(r.vendor_acct||'').replace(/"/g,'&quot;')}"
        data-name="${(r.vendor_name||r.vendor_acct||'').replace(/"/g,'&quot;')}"
        title="คลิกเพื่อดูว่าซื้ออะไรจากเจ้านี้บ้าง">
      <td class="bar-cell" style="max-width:240px">
        <span class="fill" style="width:${(+r.recv_value/max*100).toFixed(0)}%"></span>
        <span style="position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:230px"
              title="${(r.vendor_name||'').replace(/"/g,'')} (${r.vendor_acct})">${r.vendor_name||r.vendor_acct} <span style="color:var(--muted);font-size:11px">›</span></span>
      </td>
      <td class="num">${fmtB(r.recv_value)}</td>
      <td class="num">${(+r.share_pct).toFixed(1)}%</td>
      <td class="num">${otCell}</td>
      <td class="num">${ld}</td>
      <td class="num">${fmtN(r.lines_recv||0)}</td>
      <td class="num">${retCell}</td>
    </tr>`;
  }).join("");
  body.querySelectorAll("tr.clickable").forEach(tr=>{
    tr.onclick = () => openSupplierItems(lastBrand, tr.dataset.acct, tr.dataset.name);
  });
}

// =============================================================================
//  EXECUTIVE KPI (ภาพรวมผู้บริหาร)
// =============================================================================
async function loadExec(brand){
  lastBrand = brand;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลด KPI ${brand}…</div>`;
  try{
    const k = await api(`/api/exec/kpi?brand=${brand}${dp()}`);
    renderExec(app, k);
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function renderExec(app, k){
  const fmtPct = v => v==null ? "—" : (v>0?"+":"")+(+v).toFixed(1)+"%";
  // PPV: บวก = จ่ายแพงกว่ามาตรฐาน (ไม่ดี=แดง), ลบ = ถูกกว่า (ดี=เขียว)
  const ppvColor = k.ppv_pct==null ? "var(--ink)" : (k.ppv_pct>2?"var(--c4)":k.ppv_pct<-2?"var(--c3)":"var(--c2)");
  const otColor  = k.ontime_pct==null ? "var(--ink)" : (k.ontime_pct>=90?"var(--c3)":k.ontime_pct>=75?"var(--c2)":"var(--c4)");
  const fillColor= k.fill_pct==null ? "var(--ink)" : (k.fill_pct>=95?"var(--c3)":k.fill_pct>=80?"var(--c2)":"var(--c4)");
  app.innerHTML = `
    <div class="exec-grid">
      <div class="exec-card">
        <div class="ex-label">มูลค่าจัดซื้อ (รับจริง)</div>
        <div class="ex-value">${fmtB(k.total_purchase)}</div>
        <div class="ex-sub">Total Purchase Value · ช่วงที่เลือก</div>
      </div>
      <div class="exec-card ${(k.ppv_items||0)>0?'clickable-card':''}" id="ppvCard">
        <div class="ex-label">ส่วนต่างราคา vs มาตรฐาน ${(k.ppv_items||0)>0?'<span style="font-weight:400;color:var(--muted);font-size:11px">คลิกดูรายการ ›</span>':''}</div>
        <div class="ex-value" style="color:${ppvColor}">${k.ppv_pct==null?'—':fmtPct(k.ppv_pct)}</div>
        <div class="ex-sub">Purchase Price Variance (หมวด Goods) · ${fmtN(k.ppv_items)} รายการมีราคามาตรฐาน<br>
          <span style="color:${ppvColor}">${k.ppv_pct==null?'':(k.ppv_pct>0?'จ่ายสูงกว่ามาตรฐาน':'จ่ายต่ำกว่ามาตรฐาน')}</span>
          ${(k.ppv_items||0)<20?`<span style="color:var(--c2)">⚠ ข้อมูลน้อย — AX มีราคามาตรฐานไม่ครบ</span>`:''}</div>
      </div>
      <div class="exec-card">
        <div class="ex-label">ส่งตรงเวลา (Supplier)</div>
        <div class="ex-value" style="color:${otColor}">${k.ontime_pct==null?'—':k.ontime_pct.toFixed(1)+'%'}</div>
        <div class="ex-sub">Supplier On-Time · ${fmtN(k.ontime_lines)}/${fmtN(k.due_lines)} บรรทัดมีกำหนด</div>
      </div>
      <div class="exec-card">
        <div class="ex-label">อัตรารับครบ (PO Fill Rate)</div>
        <div class="ex-value" style="color:${fillColor}">${k.fill_pct==null?'—':k.fill_pct.toFixed(1)+'%'}</div>
        <div class="ex-sub">รับจริง ${fmtB(k.fill_received)} / สั่ง ${fmtB(k.fill_ordered)} (ถ่วงมูลค่า)</div>
      </div>
      ${k.inv_value!=null?`
      <div class="exec-card">
        <div class="ex-label">มูลค่าสต๊อกคงเหลือ (Goods)</div>
        <div class="ex-value">${fmtB(k.inv_value)}</div>
        <div class="ex-sub">Inventory Value · ${fmtN(k.inv_items)} รายการ${k.inv_as_of?' · ณ '+k.inv_as_of:''}
          ${k.inv_central!=null?`<br><span style="color:var(--muted)">คลังกลาง ${fmtB(k.inv_central)} · สาขา ${fmtB(k.inv_value-k.inv_central)}</span>`:''}
          ${(k.inv_value_all!=null && k.inv_value_all > k.inv_value*1.005)?`<br><span style="color:var(--muted)">+ ZZ/ZF ค่าใช้จ่าย ${fmtB(k.inv_value_all-k.inv_value)}</span>`:''}</div>
      </div>`:''}
      ${k.doi_days!=null?`
      <div class="exec-card">
        <div class="ex-label">จำนวนวันที่สต๊อกพอใช้ <span style="font-weight:400;color:var(--muted);font-size:11px">คลังกลาง</span></div>
        <div class="ex-value" style="color:${k.doi_days>90?'var(--c2)':k.doi_days<7?'var(--c4)':'var(--ink)'}">${fmtN(k.doi_days)} <span style="font-size:18px">วัน</span></div>
        <div class="ex-sub">Days of Inventory · COGS ~${fmtB(k.cogs_daily)}/วัน (${k.cogs_window} วัน)</div>
      </div>
      <div class="exec-card">
        <div class="ex-label">รอบหมุนสต๊อก (Turnover) <span style="font-weight:400;color:var(--muted);font-size:11px">คลังกลาง</span></div>
        <div class="ex-value">${k.turnover==null?'—':(+k.turnover).toFixed(1)} <span style="font-size:18px">รอบ/ปี</span></div>
        <div class="ex-sub">Inventory Turnover · ยิ่งสูง = หมุนไว เงินจมน้อย</div>
      </div>`:''}
      ${k.overstock_value!=null?`
      <div class="exec-card">
        <div class="ex-label">สต๊อกไม่เคลื่อนไหว (90 วัน) <span style="font-weight:400;color:var(--muted);font-size:11px">คลังกลาง</span></div>
        <div class="ex-value" style="color:${k.overstock_value>0?'var(--c2)':'var(--ink)'}">${fmtB(k.overstock_value)}</div>
        <div class="ex-sub">Dead Stock · ${fmtN(k.overstock_items)} รายการ ไม่มีการใช้เลยใน 90 วัน${k.inv_central?' · '+(k.overstock_value/k.inv_central*100).toFixed(0)+'% ของคลังกลาง':''}</div>
      </div>`:''}
    </div>

    <div class="panel" style="margin-top:18px">
      <h2>KPI ที่ยังไม่เปิด (รอข้อมูลเพิ่ม)</h2>
      <div class="roadmap">
        <div class="rm-item"><b>งบประมาณ</b><span>Budget Utilization%</span><em>รอดึงงบจากโมดูล Budget (AX)</em></div>
        <div class="rm-item"><b>บริการสาขา</b><span>Branch Fill Rate% · Distribution On-Time% · Waste Cost</span><em>รอข้อมูลใบเบิก/รอบส่ง/ของเสีย</em></div>
      </div>
    </div>`;

  const pc=document.getElementById("ppvCard");
  if(pc && pc.classList.contains("clickable-card")) pc.onclick=()=>openPpvDetail(lastBrand);
}

// drill-down PPV: รายการที่ทำให้ส่วนต่างพุ่ง
async function openPpvDetail(brand){
  const bg=document.getElementById("modalBg");
  document.getElementById("modalTitle").textContent="ส่วนต่างราคา vs มาตรฐาน — รายการที่กระทบมากสุด";
  document.getElementById("modalSub").textContent="มูลค่าส่วนต่าง = (ราคาจริง − มาตรฐาน) × ปริมาณ · เฉพาะหมวด Goods"+
    ((dateRange.from||dateRange.to)?` · ${dateRange.from||'เริ่มต้น'} ถึง ${dateRange.to||'ปัจจุบัน'}`:" · ทุกช่วงเวลา");
  const body=document.getElementById("modalBody");
  body.innerHTML=`<div class="loading">กำลังโหลด…</div>`;
  bg.classList.add("show");
  try{
    const rows=await api(`/api/exec/ppv-detail?brand=${brand}&limit=50${dp()}`);
    if(!rows.length){ body.innerHTML=`<div style="color:var(--muted);padding:20px;text-align:center">ไม่มีข้อมูล</div>`; return; }
    const maxv=Math.max(...rows.map(r=>Math.abs(+r.var_value||0)),1);
    body.innerHTML=`
      <div style="font-size:12px;color:var(--ink-2);margin-bottom:10px">เรียงตามมูลค่าส่วนต่างสูงสุด (บวก = จ่ายแพงกว่ามาตรฐาน)</div>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>วัตถุดิบ</th><th>หมวด</th>
        <th class="num">มาตรฐาน</th><th class="num">จริง(เฉลี่ย)</th><th class="num">%</th>
        <th class="num">ปริมาณ</th><th class="num">มูลค่าส่วนต่าง</th><th class="num">%รวม</th>
      </tr></thead><tbody>
      ${rows.map(r=>{
        const v=+r.var_value||0, up=v>0;
        const pct=r.pct_vs_std;
        return `<tr>
          <td class="bar-cell" style="max-width:240px">
            <span class="fill" style="width:${(Math.abs(v)/maxv*100).toFixed(0)}%;background:${up?'var(--c4)':'var(--c3)'}"></span>
            <span style="position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:230px"
                  title="${(r.item_name||'').replace(/"/g,'&quot;')}">${r.item_id} ${r.item_name||''}</span>
          </td>
          <td>${r.item_group||'-'}</td>
          <td class="num">฿${fmtP(r.std_price)}</td>
          <td class="num"><b>฿${fmtP(r.avg_price)}</b></td>
          <td class="num" style="color:${up?'var(--c4)':'var(--c3)'}">${pct==null?'—':(pct>0?'+':'')+pct.toFixed(0)+'%'}</td>
          <td class="num">${fmtN(r.qty)}</td>
          <td class="num" style="color:${up?'var(--c4)':'var(--c3)'}">${up?'+':''}${fmtB(v)}</td>
          <td class="num">${(+r.share_pct).toFixed(1)}%</td>
        </tr>`;
      }).join("")}
      </tbody></table></div>`;
  }catch(e){ body.innerHTML=`<div class="err">โหลดไม่ได้: ${e.message}</div>`; }
}

// =============================================================================
//  AUTH FLOW — login / logout / user chip / เปลี่ยนรหัส / จัดการผู้ใช้ (admin)
// =============================================================================
function showGate(msg){
  document.getElementById("loginErr").textContent = msg || "";
  document.getElementById("loginGate").classList.add("show");
  document.getElementById("userBox").style.display = "none";
  setTimeout(()=>document.getElementById("loginUser").focus(), 50);
}
function hideGate(){ document.getElementById("loginGate").classList.remove("show"); }

document.getElementById("loginForm").onsubmit = async (e)=>{
  e.preventDefault();
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  const btn=document.getElementById("loginBtn"), err=document.getElementById("loginErr");
  if(!u||!p){ err.textContent="กรอกชื่อผู้ใช้และรหัสผ่าน"; return; }
  btn.disabled=true; btn.textContent="กำลังเข้าสู่ระบบ…"; err.textContent="";
  try{
    const res=await fetch(API+"/api/login",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail||"เข้าสู่ระบบไม่สำเร็จ");
    authToken=data.token; authUser=data.user;
    try{ localStorage.setItem("pa-token",authToken); localStorage.setItem("pa-user",JSON.stringify(authUser)); }catch(e){}
    document.getElementById("loginPass").value="";
    hideGate(); afterLogin();
  }catch(ex){ err.textContent=ex.message; }
  finally{ btn.disabled=false; btn.textContent="เข้าสู่ระบบ"; }
};

function doLogout(msg){
  authToken=null; authUser=null;
  try{ localStorage.removeItem("pa-token"); localStorage.removeItem("pa-user"); }catch(e){}
  showGate(msg);
}

function renderUserChip(){
  const box=document.getElementById("userBox");
  box.style.display="flex";
  const isAdmin = authUser && authUser.role==="admin";
  box.innerHTML = `
    <span class="uchip">${authUser.username}${isAdmin?' <span class="role">ADMIN</span>':''}</span>
    ${isAdmin?'<button class="iconbtn" id="btnUsers" title="จัดการผู้ใช้">👥</button>':''}
    <button class="iconbtn" id="btnChpw" title="เปลี่ยนรหัสผ่าน">🔑</button>
    <button class="iconbtn" id="btnLogout" title="ออกจากระบบ">ออก</button>`;
  document.getElementById("btnLogout").onclick=()=>doLogout();
  document.getElementById("btnChpw").onclick=()=>openChangePw(false);
  if(isAdmin) document.getElementById("btnUsers").onclick=openUsers;
}

function afterLogin(){
  renderUserChip();
  initBrands();
  if(authUser && authUser.must_change) openChangePw(true);
}

// ===== เปลี่ยนรหัสผ่าน =====
function openChangePw(forced){
  document.getElementById("pwSub").textContent = forced
    ? "กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน (รหัสเริ่มต้น)" : "";
  document.getElementById("pwOld").value=""; document.getElementById("pwNew").value="";
  document.getElementById("pwErr").textContent="";
  document.getElementById("pwX").style.display = forced ? "none" : "";
  document.getElementById("pwBg").classList.add("show");
}
document.getElementById("pwX").onclick=()=>document.getElementById("pwBg").classList.remove("show");
document.getElementById("pwSave").onclick=async ()=>{
  const err=document.getElementById("pwErr");
  const oldp=document.getElementById("pwOld").value, newp=document.getElementById("pwNew").value;
  if(newp.length<6){ err.textContent="รหัสใหม่ต้องยาวอย่างน้อย 6 ตัว"; return; }
  try{
    await apiSend("/api/change-password","POST",{old_password:oldp,new_password:newp});
    if(authUser){ authUser.must_change=false; try{localStorage.setItem("pa-user",JSON.stringify(authUser));}catch(e){} }
    document.getElementById("pwBg").classList.remove("show");
  }catch(ex){ err.textContent=ex.message; }
};

// ===== จัดการผู้ใช้ (admin) =====
async function openUsers(){
  document.getElementById("usersBg").classList.add("show");
  const body=document.getElementById("usersBody");
  body.innerHTML=`<div class="loading">กำลังโหลด…</div>`;
  try{
    const [users, brands] = await Promise.all([
      api("/api/admin/users"), api("/api/brands")
    ]);
    renderUsers(users, brands.map(b=>b.brand_code));
  }catch(ex){ body.innerHTML=`<div class="err">${ex.message}</div>`; }
}
document.getElementById("usersX").onclick=()=>document.getElementById("usersBg").classList.remove("show");

function brandChecks(codes, selected, name){
  const sel=new Set(selected||[]);
  return codes.map(c=>`<label><input type="checkbox" value="${c}" data-grp="${name}"
    ${sel.has(c)?'checked':''}> ${c}</label>`).join("");
}
function readChecks(name){
  return [...document.querySelectorAll(`input[data-grp="${name}"]:checked`)].map(x=>x.value);
}

function renderUsers(users, allBrands){
  const body=document.getElementById("usersBody");
  body.innerHTML=`
    <div class="addrow">
      <div><label style="font-size:12px;color:var(--ink-2);font-weight:600">ชื่อผู้ใช้ใหม่</label>
        <input id="nuUser" style="width:100%;box-sizing:border-box"></div>
      <div><label style="font-size:12px;color:var(--ink-2);font-weight:600">รหัสผ่าน (≥6)</label>
        <input id="nuPass" type="text" style="width:100%;box-sizing:border-box"></div>
      <button class="btn-primary" id="nuAdd">+ เพิ่ม</button>
      <div class="full">
        <label style="font-size:12px;color:var(--ink-2);font-weight:600">สิทธิ์แบรนด์
          <span style="font-weight:400">(ไม่ติ๊ก = ไม่เห็นแบรนด์ไหนเลย · ติ๊ก = user ธรรมดา)</span></label>
        <div class="brandchks">
          ${brandChecks(allBrands, [], "new")}
          <label style="margin-left:12px"><input type="checkbox" id="nuAdmin"> <b>เป็น admin (เห็นทุกแบรนด์)</b></label>
        </div>
      </div>
      <div class="full gate-err" id="nuErr" style="margin:0"></div>
    </div>
    <div style="overflow-x:auto">
    <table><thead><tr>
      <th>ผู้ใช้</th><th>สิทธิ์</th><th>แบรนด์</th><th>สถานะ</th><th class="num">จัดการ</th>
    </tr></thead><tbody id="uBody"></tbody></table>
    </div>`;

  const tb=document.getElementById("uBody");
  tb.innerHTML = users.map(u=>{
    const isAdmin=u.role==="admin";
    const brandTxt = isAdmin ? '<span style="color:var(--ink-2)">ทุกแบรนด์</span>'
      : (u.brands ? u.brands.split(",").map(b=>`<span class="badge ok" style="margin-right:3px">${b}</span>`).join('') : '<span style="color:var(--muted)">—</span>');
    return `<tr data-id="${u.id}" data-brands="${u.brands||''}" data-role="${u.role}">
      <td>${u.username}${u.must_change?' <span style="color:var(--c2);font-size:10px">(ต้องเปลี่ยนรหัส)</span>':''}</td>
      <td>${isAdmin?'<span class="role" style="background:var(--accent);color:#fff;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700">ADMIN</span>':'user'}</td>
      <td>${brandTxt}</td>
      <td>${u.is_active?'<span style="color:var(--c3)">ใช้งาน</span>':'<span style="color:var(--muted)">ปิด</span>'}</td>
      <td class="num" style="white-space:nowrap">
        <button class="mini" data-act="edit">แก้สิทธิ์</button>
        <button class="mini" data-act="reset">รีเซ็ตรหัส</button>
        <button class="mini danger" data-act="del">ลบ</button>
      </td>
    </tr>`;
  }).join("");

  // เพิ่ม user
  document.getElementById("nuAdd").onclick=async ()=>{
    const err=document.getElementById("nuErr");
    const uname=document.getElementById("nuUser").value.trim();
    const pass=document.getElementById("nuPass").value;
    const admin=document.getElementById("nuAdmin").checked;
    const brs=readChecks("new");
    if(!uname||pass.length<6){ err.textContent="กรอกชื่อผู้ใช้และรหัสผ่าน ≥6 ตัว"; return; }
    try{
      await apiSend("/api/admin/users","POST",{username:uname,password:pass,
        role:admin?"admin":"user", brands:admin?[]:brs});
      openUsers();
    }catch(ex){ err.textContent=ex.message; }
  };

  // ปุ่มในแต่ละแถว
  tb.querySelectorAll("button[data-act]").forEach(btn=>{
    const tr=btn.closest("tr"); const id=tr.dataset.id;
    btn.onclick=async ()=>{
      const act=btn.dataset.act;
      try{
        if(act==="del"){
          if(!confirm("ลบผู้ใช้นี้?")) return;
          await apiSend(`/api/admin/users/${id}`,"DELETE"); openUsers();
        } else if(act==="reset"){
          const np=prompt("ตั้งรหัสผ่านใหม่ (≥6 ตัว):"); if(!np) return;
          if(np.length<6){ alert("รหัสต้องยาว ≥6 ตัว"); return; }
          await apiSend(`/api/admin/users/${id}`,"PATCH",{password:np});
          alert("รีเซ็ตรหัสแล้ว — ผู้ใช้ต้องเปลี่ยนรหัสเมื่อเข้าครั้งถัดไป");
        } else if(act==="edit"){
          openEditRow(tr, allBrands);
        }
      }catch(ex){ alert(ex.message); }
    };
  });
}

// แก้สิทธิ์แบรนด์/role แบบ inline
function openEditRow(tr, allBrands){
  const id=tr.dataset.id;
  const curBrands=(tr.dataset.brands||"").split(",").filter(Boolean);
  const isAdmin=tr.dataset.role==="admin";
  const cell=tr.querySelector("td:nth-child(3)");
  cell.innerHTML=`
    <div class="brandchks" style="margin-bottom:6px">${brandChecks(allBrands, curBrands, "edit"+id)}
      <label style="margin-left:8px"><input type="checkbox" class="editAdmin" ${isAdmin?'checked':''}> admin</label>
    </div>
    <button class="mini" data-save="1">บันทึก</button>
    <button class="mini" data-cancel="1">ยกเลิก</button>`;
  cell.querySelector("[data-cancel]").onclick=openUsers;
  cell.querySelector("[data-save]").onclick=async ()=>{
    const admin=cell.querySelector(".editAdmin").checked;
    const brs=readChecks("edit"+id);
    try{
      await apiSend(`/api/admin/users/${id}`,"PATCH",{role:admin?"admin":"user", brands:admin?[]:brs});
      openUsers();
    }catch(ex){ alert(ex.message); }
  };
}

// ===== bootstrap =====
if(authToken && authUser){ afterLogin(); } else { showGate(); }
</script>
