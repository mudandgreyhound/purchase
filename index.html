<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Summary — Greyhound Group</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5;
    --ink:#1a1d21; --ink-2:#5a626b; --muted:#9aa2ab; --border:#e3e6ea;
    /* categorical (fixed order — ห้าม cycle): blue, orange, teal, magenta, gold
       ผ่าน CVD validator (deutan/tritan ΔE OK) */
    --c1:#3b6fb0; --c2:#d97b2e; --c3:#2a9d8f; --c4:#b5478f; --c5:#c9a227;
    --accent:#3b6fb0;
  }
  :root[data-theme="dark"]{
    --bg:#15181c; --surface:#1e2228; --surface-2:#262b31;
    --ink:#e8eaed; --ink-2:#aab2bb; --muted:#6b737c; --border:#2e343b;
    /* categorical คงชุดเดียวกับ light (ผ่าน CVD + contrast บน dark surface) */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181c; --surface:#1e2228; --surface-2:#262b31;
      --ink:#e8eaed; --ink-2:#aab2bb; --muted:#6b737c; --border:#2e343b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;margin-bottom:16px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
  select,button{font:inherit;padding:7px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
  input{font:inherit;padding:7px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border)}
  .tab{padding:8px 16px;border:none;background:none;color:var(--ink-2);cursor:pointer;
    font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  /* overdue badge */
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .badge.over{background:var(--c4);color:#fff}
  .badge.soon{background:var(--c2);color:#fff}
  .badge.ok{background:var(--surface-2);color:var(--ink-2)}
  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px}
  .kpi .label{color:var(--ink-2);font-size:12px;margin-bottom:6px}
  .kpi .value{font-size:24px;font-weight:700;letter-spacing:-0.5px}
  .kpi .unit{font-size:13px;color:var(--muted);font-weight:400}
  .kpi.mom .value.up{color:var(--c4)} .kpi.mom .value.down{color:var(--c5)}
  /* panels */
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.grid.two{grid-template-columns:3fr 2fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px}
  .panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
  .chart-box{position:relative;height:300px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--ink-2);font-weight:600;font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar-cell{position:relative}
  .bar-cell .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:60%;background:var(--c1);opacity:.15;border-radius:4px}
  .loading{color:var(--muted);padding:40px;text-align:center}
  .err{color:var(--c4);padding:16px;background:var(--surface-2);border-radius:8px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
    vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="pageTitle">Purchase Dashboard — จัดซื้อ</h1>
      <div class="sub">Greyhound Group · ข้อมูลจาก AX 4.0 → MySQL</div>
    </div>
    <div class="toolbar">
      <select id="brandSel"></select>
      <button id="themeBtn" title="สลับโหมดสี">🌓</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="summary">สรุปยอดจัดซื้อ</button>
    <button class="tab" data-tab="outstanding">PO ค้างรับ</button>
    <button class="tab" data-tab="price">วิเคราะห์ราคา</button>
  </div>

  <div id="app"><div class="loading">กำลังโหลดข้อมูล…</div></div>
</div>

<script>
// ===== config =====
const API = "https://purchase-api.mobile1234.site";
const CAT = ["--c1","--c2","--c3","--c4","--c5"].map(v=>
  getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const fmtB = n => "฿" + Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0});
const fmtN = n => Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0});
let charts = {};

let currentTab = "summary";

// ===== theme toggle =====
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{localStorage.setItem("pa-theme", next)}catch(e){}
  if (lastBrand) load(lastBrand);  // re-render ให้สีตรง theme
};
try{const t=localStorage.getItem("pa-theme"); if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

// ===== tab switching =====
document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    if(lastBrand) load(lastBrand);
  };
});

// ===== fetch helper =====
async function api(path){
  const r = await fetch(API + path);
  if(!r.ok) throw new Error(path+" → "+r.status);
  return r.json();
}

let lastBrand = null;

async function initBrands(){
  const sel = document.getElementById("brandSel");
  try{
    const bs = await api("/api/brands");
    sel.innerHTML = bs.map(b=>`<option value="${b.brand_code}">${b.brand_name}</option>`).join("");
    sel.onchange = () => load(sel.value);
    load(sel.value || "GHC");
  }catch(e){
    document.getElementById("app").innerHTML =
      `<div class="err">เชื่อมต่อ API ไม่ได้: ${e.message}<br>เช็กว่า backend รันที่ ${API} แล้ว</div>`;
  }
}

// dispatch ตามแท็บที่เลือก
async function load(brand){
  if(currentTab==="outstanding") return loadOutstanding(brand);
  if(currentTab==="price") return loadPrice(brand);
  return loadSummary(brand);
}

async function loadSummary(brand){
  lastBrand = brand;
  catDrill = null;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลด ${brand}…</div>`;
  try{
    const [kpi, mom, monthly, cats, sups, locs, catDetail, supSku] = await Promise.all([
      api(`/api/summary/kpi?brand=${brand}`),
      api(`/api/summary/mom?brand=${brand}`),
      api(`/api/summary/monthly?brand=${brand}`),
      api(`/api/summary/by-category?brand=${brand}`),
      api(`/api/summary/by-supplier?brand=${brand}&limit=15`),
      api(`/api/summary/by-location?brand=${brand}`),
      api(`/api/summary/category-detail?brand=${brand}`),
      api(`/api/summary/supplier-sku?brand=${brand}&limit=15`),
    ]);
    render(app, {kpi, mom, monthly, cats, sups, locs, catDetail, supSku});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function render(app, d){
  const momUp = d.mom.pct_change > 0;
  app.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">ยอดซื้อรวม</div>
        <div class="value">${fmtB(d.kpi.total_purchase)}</div></div>
      <div class="kpi"><div class="label">จำนวน PO</div>
        <div class="value">${fmtN(d.kpi.po_count)} <span class="unit">ใบ</span></div></div>
      <div class="kpi"><div class="label">Supplier</div>
        <div class="value">${fmtN(d.kpi.supplier_count)} <span class="unit">ราย</span></div></div>
      <div class="kpi"><div class="label">รายการสินค้า</div>
        <div class="value">${fmtN(d.kpi.item_count)} <span class="unit">SKU</span></div></div>
      <div class="kpi mom"><div class="label">เทียบเดือนก่อน (${d.mom.current_month||'-'})</div>
        <div class="value ${momUp?'up':'down'}">
          ${d.mom.pct_change==null?'-':(momUp?'▲':'▼')+' '+Math.abs(d.mom.pct_change)+'%'}</div></div>
    </div>

    <div class="grid two">
      <div class="panel">
        <h2>แนวโน้มยอดซื้อรายเดือน</h2>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>สัดส่วนตามหมวด (Category) <span id="catDrillHint" style="font-weight:400;color:var(--muted);font-size:12px"></span></h2>
        <div class="chart-box" style="height:220px"><canvas id="catChart"></canvas></div>
        <div id="catLegend" style="margin-top:12px;font-size:13px"></div>
      </div>
    </div>

    <div class="grid two" style="margin-top:16px">
      <div class="panel">
        <h2>Top 15 Supplier (ยอดซื้อสูงสุด)</h2>
        <table><thead><tr>
          <th>Supplier</th><th class="num">ยอดซื้อ</th><th class="num">PO</th>
        </tr></thead><tbody id="supBody"></tbody></table>
      </div>
      <div class="panel">
        <h2>ยอดซื้อแยกตามคลัง/สาขา</h2>
        <table><thead><tr>
          <th>คลัง</th><th class="num">ยอดซื้อ</th><th class="num">PO</th>
        </tr></thead><tbody id="locBody"></tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>มูลค่าซื้อแยกตามหมวดวัตถุดิบ (รายละเอียดทุกหมวด)</h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>หมวด</th><th>กลุ่มวัตถุดิบ</th>
        <th class="num">ยอดซื้อ</th><th class="num">%</th>
        <th class="num">SKU</th><th class="num">PO</th>
      </tr></thead><tbody id="catDetailBody"></tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>จำนวนชนิดวัตถุดิบ (SKU) แยกตาม Supplier</h2>
      <table><thead><tr>
        <th>Supplier</th><th class="num">จำนวน SKU</th>
        <th class="num">PO</th><th class="num">ยอดซื้อ</th>
      </tr></thead><tbody id="supSkuBody"></tbody></table>
    </div>`;

  drawTrend(d.monthly);
  drawCategory(d.cats);
  fillLocations(d.locs);
  fillSuppliers(d.sups);
  fillCatDetail(d.catDetail);
  fillSupplierSku(d.supSku);
}

const gridColor = () => getComputedStyle(document.documentElement).getPropertyValue("--border").trim();
const inkColor  = () => getComputedStyle(document.documentElement).getPropertyValue("--ink-2").trim();

function drawTrend(rows){
  const ctx = document.getElementById("trendChart");
  charts.trend = new Chart(ctx, {
    type:"line",
    data:{ labels: rows.map(r=>r.yr_mth),
      datasets:[{ label:"ยอดซื้อ", data: rows.map(r=>+r.purchase_amount),
        borderColor:CAT[0], backgroundColor:CAT[0]+"22", borderWidth:2,
        pointRadius:3, pointHoverRadius:5, tension:.25, fill:true }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:c=>" "+fmtB(c.parsed.y) }}},
      scales:{ x:{ grid:{color:gridColor()}, ticks:{color:inkColor(),maxRotation:60,minRotation:45}},
        y:{ grid:{color:gridColor()}, ticks:{color:inkColor(),
          callback:v=>"฿"+(v/1e6).toFixed(0)+"M"}}}}
  });
}

// คำอธิบายแต่ละหมวด (ภาษาไทย) — แยกจาก prefix ของรหัสสินค้าใน AX
const CAT_DESC = {
  "Goods":   "วัตถุดิบ/สินค้าที่ซื้อมาใช้ในธุรกิจ",
  "Expense": "ค่าใช้จ่าย (ไม่ใช่ของขาย)",
  "Capex":   "สินทรัพย์ถาวร/ของลงทุน",
  "(none)":  "ไม่ระบุหมวด",
};

let catRows = [];        // เก็บ raw (category+item_group) ไว้ทำ drill-down
let catDrill = null;     // category ที่กำลัง drill อยู่ (null = ระดับบน)

function drawCategory(rows){
  if(rows) catRows = rows;          // ครั้งแรกเก็บไว้; เรียกซ้ำตอน drill ไม่ส่ง rows
  const drilling = catDrill !== null;
  const hint = document.getElementById("catDrillHint");

  // ระดับบน: รวมตาม category | ระดับ drill: เฉพาะ item_group ใน category นั้น
  const agg={};
  catRows.forEach(r=>{
    if(drilling){
      if(r.category===catDrill) agg[r.item_group]=(agg[r.item_group]||0)+(+r.purchase_amount);
    }else{
      agg[r.category]=(agg[r.category]||0)+(+r.purchase_amount);
    }
  });
  const labels=Object.keys(agg).sort((a,b)=>agg[b]-agg[a]);
  const data=labels.map(k=>agg[k]);
  const total = data.reduce((a,b)=>a+b,0) || 1;

  if(hint) hint.textContent = drilling
    ? `▸ ${catDrill} — คลิกเพื่อย้อนกลับ` : "คลิกที่วงเพื่อดูหมวดย่อย";

  if(charts.cat) charts.cat.destroy();
  const ctx=document.getElementById("catChart");
  charts.cat=new Chart(ctx,{
    type:"doughnut",
    data:{ labels, datasets:[{ data,
      backgroundColor:labels.map((_,i)=>CAT[i%CAT.length]),
      borderColor:getComputedStyle(document.documentElement).getPropertyValue("--surface").trim(),
      borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:(e,els)=>{
        if(drilling){ catDrill=null; drawCategory(); return; }   // คลิกตอน drill = ย้อนกลับ
        if(els.length){ catDrill=labels[els[0].index]; drawCategory(); }  // คลิก slice = drill เข้า
      },
      plugins:{
        legend:{position:"bottom",labels:{color:inkColor(),boxWidth:12,padding:10,font:{size:11},
          generateLabels:(chart)=>{
            const ds=chart.data.datasets[0];
            return chart.data.labels.map((lb,i)=>({
              text:`${lb} ${(ds.data[i]/total*100).toFixed(1)}%`,
              fillStyle:ds.backgroundColor[i], strokeStyle:ds.backgroundColor[i], index:i,
            }));
          }}},
        tooltip:{ callbacks:{
          title:c=>c[0].label,
          label:c=>" "+fmtB(c.parsed)+"  ("+(c.parsed/total*100).toFixed(1)+"%)",
          afterLabel:c=>drilling?"":(CAT_DESC[c.label]||""),
        }}}}
  });

  // คำอธิบายใต้กราฟ (เฉพาะระดับบน — บอก Goods/Expense/Capex คืออะไร)
  const box=document.getElementById("catLegend");
  if(box){
    if(drilling){
      box.innerHTML = labels.slice(0,8).map((lb,i)=>`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <span class="dot" style="background:${CAT[i%CAT.length]}"></span>
          <span style="flex:1">${lb}</span>
          <b>${fmtB(agg[lb])}</b>
          <span style="color:var(--muted);width:48px;text-align:right">${(agg[lb]/total*100).toFixed(1)}%</span>
        </div>`).join("");
    }else{
      box.innerHTML = labels.map((lb,i)=>`
        <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px">
          <span class="dot" style="background:${CAT[i%CAT.length]};margin-top:4px"></span>
          <div><b>${lb}</b> — ${fmtB(agg[lb])} (${(agg[lb]/total*100).toFixed(1)}%)
            <div style="color:var(--muted);font-size:12px">${CAT_DESC[lb]||""}</div></div>
        </div>`).join("");
    }
  }
}

function fillLocations(rows){
  const body=document.getElementById("locBody");
  if(!body) return;
  if(!rows || !rows.length){ body.innerHTML=`<tr><td colspan="3" style="color:var(--muted)">ไม่มีข้อมูลคลัง</td></tr>`; return; }
  const max=Math.max(...rows.map(r=>+r.purchase_amount),1);
  body.innerHTML = rows.slice(0,15).map(r=>`
    <tr>
      <td class="bar-cell">
        <span class="fill" style="width:${(+r.purchase_amount/max*100).toFixed(0)}%"></span>
        <span style="position:relative">${r.invent_location}${r.location_name?' — '+r.location_name:''}</span>
      </td>
      <td class="num">${fmtB(r.purchase_amount)}</td>
      <td class="num">${fmtN(r.po_count)}</td>
    </tr>`).join("");
}

function fillSuppliers(rows){
  const max = Math.max(...rows.map(r=>+r.purchase_amount), 1);
  document.getElementById("supBody").innerHTML = rows.map(r=>`
    <tr>
      <td class="bar-cell">
        <span class="fill" style="width:${(+r.purchase_amount/max*100).toFixed(0)}%"></span>
        <span style="position:relative">${r.vendor_name||r.vendor_acct||'(ไม่ระบุ)'}</span>
      </td>
      <td class="num">${fmtB(r.purchase_amount)}</td>
      <td class="num">${fmtN(r.po_count)}</td>
    </tr>`).join("");
}

const CAT_BADGE = {"Goods":"ok","Expense":"soon","Capex":"over"};

function fillCatDetail(rows){
  const body=document.getElementById("catDetailBody");
  if(!body) return;
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
  const total=rows.reduce((a,r)=>a+(+r.purchase_amount||0),0)||1;
  const max=Math.max(...rows.map(r=>+r.purchase_amount),1);
  body.innerHTML=rows.map(r=>`
    <tr>
      <td><span class="badge ${CAT_BADGE[r.category]||'ok'}">${r.category}</span></td>
      <td class="bar-cell">
        <span class="fill" style="width:${(+r.purchase_amount/max*100).toFixed(0)}%"></span>
        <span style="position:relative">${r.item_group}${r.item_group_name?' — '+r.item_group_name:''}</span>
      </td>
      <td class="num">${fmtB(r.purchase_amount)}</td>
      <td class="num">${(+r.purchase_amount/total*100).toFixed(1)}%</td>
      <td class="num">${fmtN(r.sku_count)}</td>
      <td class="num">${fmtN(r.po_count)}</td>
    </tr>`).join("");
}

function fillSupplierSku(rows){
  const body=document.getElementById("supSkuBody");
  if(!body) return;
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="4" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
  const max=Math.max(...rows.map(r=>+r.sku_count),1);
  body.innerHTML=rows.map(r=>`
    <tr>
      <td class="bar-cell">
        <span class="fill" style="width:${(+r.sku_count/max*100).toFixed(0)}%"></span>
        <span style="position:relative">${r.vendor_name||r.vendor_acct}</span>
      </td>
      <td class="num"><b>${fmtN(r.sku_count)}</b> ชนิด</td>
      <td class="num">${fmtN(r.po_count)}</td>
      <td class="num">${fmtB(r.purchase_amount)}</td>
    </tr>`).join("");
}

// =============================================================================
//  PO OUTSTANDING (มุมที่ 2)
// =============================================================================
async function loadOutstanding(brand){
  lastBrand = brand;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลด PO ค้างรับ ${brand}…</div>`;
  try{
    const [kpi, aging, sups, locs, list] = await Promise.all([
      api(`/api/po/kpi?brand=${brand}`),
      api(`/api/po/aging?brand=${brand}`),
      api(`/api/po/by-supplier?brand=${brand}&limit=15`),
      api(`/api/po/by-location?brand=${brand}`),
      api(`/api/po/list?brand=${brand}&limit=200`),
    ]);
    renderOutstanding(app, {kpi, aging, sups, locs, list});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

const AGING_ORDER = ["เกิน 30 วัน","เกิน 8-30 วัน","เกิน 1-7 วัน","ยังไม่ถึงกำหนด","ไม่ระบุกำหนด"];
const AGING_COLOR = {"เกิน 30 วัน":"--c4","เกิน 8-30 วัน":"--c2","เกิน 1-7 วัน":"--c5",
  "ยังไม่ถึงกำหนด":"--c1","ไม่ระบุกำหนด":"--muted"};

function renderOutstanding(app, d){
  const k=d.kpi;
  app.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">PO ค้างรับ</div>
        <div class="value">${fmtN(k.po_count)} <span class="unit">ใบ</span></div></div>
      <div class="kpi"><div class="label">บรรทัดค้าง</div>
        <div class="value">${fmtN(k.line_count)} <span class="unit">รายการ</span></div></div>
      <div class="kpi"><div class="label">มูลค่าค้างรับ (ประมาณ)</div>
        <div class="value">${fmtB(k.outstanding_value)}</div></div>
      <div class="kpi"><div class="label">เกินกำหนดส่ง</div>
        <div class="value" style="color:var(--c4)">${fmtN(k.overdue_lines)} <span class="unit">รายการ</span></div></div>
    </div>

    <div class="grid two">
      <div class="panel">
        <h2>Aging — PO ค้างตามช่วงเกินกำหนด</h2>
        <div class="chart-box" style="height:240px"><canvas id="agingChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>Supplier ค้างส่งมากสุด</h2>
        <table><thead><tr><th>Supplier</th><th class="num">มูลค่าค้าง</th><th class="num">PO</th></tr></thead>
          <tbody id="poSupBody"></tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>รายการ PO ค้างรับ (เรียงตามเกินกำหนดมากสุด)</h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>PO</th><th>สินค้า</th><th>Supplier</th><th>คลัง</th>
        <th class="num">กำหนดส่ง</th><th class="num">สั่ง</th><th class="num">ค้าง</th>
        <th class="num">มูลค่าค้าง</th><th class="num">สถานะ</th>
      </tr></thead><tbody id="poListBody"></tbody></table>
      </div>
    </div>`;

  drawAging(d.aging);
  fillPoSuppliers(d.sups);
  fillPoList(d.list);
}

function drawAging(rows){
  const m={}; rows.forEach(r=>m[r.bucket]=r);
  const labels=AGING_ORDER.filter(b=>m[b]);
  const data=labels.map(b=>+m[b].outstanding_value||0);
  const colors=labels.map(b=>getComputedStyle(document.documentElement).getPropertyValue(AGING_COLOR[b]||"--c1").trim());
  if(charts.aging) charts.aging.destroy();
  charts.aging=new Chart(document.getElementById("agingChart"),{
    type:"bar",
    data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:4,
      borderColor:getComputedStyle(document.documentElement).getPropertyValue("--surface").trim(),borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>" "+fmtB(c.parsed.x)+"  ("+fmtN(m[c.label].line_count)+" รายการ)"}}},
      scales:{x:{grid:{color:gridColor()},ticks:{color:inkColor(),callback:v=>"฿"+(v/1e6).toFixed(1)+"M"}},
        y:{grid:{display:false},ticks:{color:inkColor()}}}}
  });
}

function fillPoSuppliers(rows){
  const body=document.getElementById("poSupBody");
  if(!rows||!rows.length){body.innerHTML=`<tr><td colspan="3" style="color:var(--muted)">ไม่มี PO ค้าง</td></tr>`;return;}
  const max=Math.max(...rows.map(r=>+r.outstanding_value),1);
  body.innerHTML=rows.map(r=>`
    <tr>
      <td class="bar-cell">
        <span class="fill" style="width:${(+r.outstanding_value/max*100).toFixed(0)}%"></span>
        <span style="position:relative">${r.vendor_name||r.vendor_acct}</span>
      </td>
      <td class="num">${fmtB(r.outstanding_value)}</td>
      <td class="num">${fmtN(r.po_count)}</td>
    </tr>`).join("");
}

function fillPoList(rows){
  const body=document.getElementById("poListBody");
  if(!rows||!rows.length){body.innerHTML=`<tr><td colspan="9" style="color:var(--muted)">ไม่มี PO ค้างรับ 🎉</td></tr>`;return;}
  const ST={1:"Open",2:"รับบางส่วน"};
  body.innerHTML=rows.map(r=>{
    const od=r.days_overdue;
    let badge;
    if(od>30) badge=`<span class="badge over">เกิน ${od} วัน</span>`;
    else if(od>0) badge=`<span class="badge soon">เกิน ${od} วัน</span>`;
    else badge=`<span class="badge ok">${od===0?'ครบกำหนดวันนี้':'อีก '+(-od)+' วัน'}</span>`;
    return `<tr>
      <td>${r.purch_id}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.item_name||'').replace(/"/g,'')}">${r.item_id} ${r.item_name||''}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.vendor_name||r.vendor_acct||''}</td>
      <td title="${(r.location_name||'').replace(/"/g,'')}">${r.invent_location||'-'}</td>
      <td class="num">${r.delivery_date||'-'}<br>${badge}</td>
      <td class="num">${fmtN(r.qty_ordered)}</td>
      <td class="num"><b>${fmtN(r.remain_physical)}</b></td>
      <td class="num">${fmtB(r.outstanding_value)}</td>
      <td class="num">${ST[r.purch_status]||r.purch_status}</td>
    </tr>`;
  }).join("");
}

// =============================================================================
//  PRICE ANALYSIS (มุมที่ 3)
// =============================================================================
let priceDir = "all";   // ทิศทางที่กรองในตารางราคาเปลี่ยนแปลง

async function loadPrice(brand){
  lastBrand = brand;
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading">กำลังโหลดราคา ${brand}…</div>`;
  try{
    const [changes, summary] = await Promise.all([
      api(`/api/price/changes?brand=${brand}&direction=${priceDir}&limit=50`),
      api(`/api/price/summary?brand=${brand}&limit=100`),
    ]);
    renderPrice(app, {brand, changes, summary});
  }catch(e){
    app.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function renderPrice(app, d){
  app.innerHTML = `
    <div class="panel">
      <h2>รายการราคาซื้อเปลี่ยนแปลง (ล่าสุด vs ครั้งก่อน)
        <span style="font-weight:400;font-size:12px;margin-left:8px">
          <button class="tab ${priceDir==='all'?'active':''}" data-dir="all" style="padding:3px 10px;font-size:12px">ทั้งหมด</button>
          <button class="tab ${priceDir==='up'?'active':''}" data-dir="up" style="padding:3px 10px;font-size:12px">ขึ้น ▲</button>
          <button class="tab ${priceDir==='down'?'active':''}" data-dir="down" style="padding:3px 10px;font-size:12px">ลง ▼</button>
        </span>
      </h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>สินค้า</th><th>หมวด</th><th class="num">ราคาก่อน</th>
        <th class="num">ราคาล่าสุด</th><th class="num">เปลี่ยน</th><th class="num">%</th>
        <th class="num">วันล่าสุด</th>
      </tr></thead><tbody id="priceChgBody"></tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>สรุปราคาวัตถุดิบ (ล่าสุด / เฉลี่ย / มาตรฐาน)
        <span style="font-weight:400;font-size:12px;color:var(--muted);margin-left:8px">คลิกสินค้าเพื่อเทียบราคาระหว่าง supplier</span>
      </h2>
      <input id="priceSearch" placeholder="ค้นหาสินค้า (รหัส/ชื่อ)…" style="margin-bottom:10px;width:260px">
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>สินค้า</th><th>หมวด</th><th class="num">หน่วย</th>
        <th class="num">ราคาล่าสุด</th><th class="num">เฉลี่ย</th>
        <th class="num">มาตรฐาน</th><th class="num">vs มาตรฐาน</th>
        <th class="num">Supplier</th>
      </tr></thead><tbody id="priceSumBody"></tbody></table>
      </div>
    </div>

    <div class="panel" id="supCmpPanel" style="margin-top:16px;display:none">
      <h2 id="supCmpTitle">เทียบราคาระหว่าง Supplier</h2>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>Supplier</th><th class="num">ราคาเฉลี่ย</th><th class="num">ต่ำสุด</th>
        <th class="num">สูงสุด</th><th class="num">ครั้งที่ซื้อ</th><th class="num">ซื้อล่าสุด</th>
      </tr></thead><tbody id="supCmpBody"></tbody></table>
      </div>
    </div>`;

  // ปุ่มกรองทิศทาง
  document.querySelectorAll("[data-dir]").forEach(b=>{
    b.onclick=()=>{ priceDir=b.dataset.dir; loadPrice(lastBrand); };
  });
  // ค้นหา
  const si=document.getElementById("priceSearch");
  si.onkeydown=async(e)=>{
    if(e.key==="Enter"){
      const rows=await api(`/api/price/summary?brand=${d.brand}&limit=100&search=${encodeURIComponent(si.value)}`);
      fillPriceSummary(rows, d.brand);
    }
  };

  fillPriceChanges(d.changes);
  fillPriceSummary(d.summary, d.brand);
}

const fmtP = n => Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});

function fillPriceChanges(rows){
  const body=document.getElementById("priceChgBody");
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="7" style="color:var(--muted)">ไม่มีรายการราคาเปลี่ยน</td></tr>`; return; }
  body.innerHTML=rows.map(r=>{
    const pct=+r.pct_change||0, up=pct>0;
    const badge=`<span class="badge ${up?'over':'ok'}" style="${up?'':'background:var(--c5);color:#fff'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
    return `<tr>
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.item_name||'').replace(/"/g,'')}">${r.item_id} ${r.item_name||''}</td>
      <td>${r.item_group||'-'}</td>
      <td class="num">฿${fmtP(r.prev_price)}</td>
      <td class="num"><b>฿${fmtP(r.latest_price)}</b></td>
      <td class="num" style="color:${up?'var(--c4)':'var(--c5)'}">${up?'+':''}${fmtP(r.diff)}</td>
      <td class="num">${badge}</td>
      <td class="num">${r.latest_date||'-'}</td>
    </tr>`;
  }).join("");
}

function fillPriceSummary(rows, brand){
  const body=document.getElementById("priceSumBody");
  if(!rows||!rows.length){ body.innerHTML=`<tr><td colspan="8" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
  body.innerHTML=rows.map(r=>{
    const std=+r.standard_price||0, latest=+r.latest_price||0;
    let vsStd='-';
    if(std>0 && latest>0){
      const diff=(latest-std)/std*100;
      const over=diff>0;
      vsStd=`<span style="color:${over?'var(--c4)':'var(--c5)'}">${over?'+':''}${diff.toFixed(1)}%</span>`;
    }
    return `<tr style="cursor:pointer" data-item="${r.item_id}" data-name="${(r.item_name||'').replace(/"/g,'')}">
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.item_name||'').replace(/"/g,'')}">${r.item_id} ${r.item_name||''}</td>
      <td>${r.item_group||'-'}</td>
      <td class="num">${r.purch_unit||'-'}</td>
      <td class="num"><b>฿${fmtP(r.latest_price)}</b></td>
      <td class="num">฿${fmtP(r.avg_price)}</td>
      <td class="num">${std>0?'฿'+fmtP(std):'-'}</td>
      <td class="num">${vsStd}</td>
      <td class="num">${fmtN(r.vendor_count)} ราย</td>
    </tr>`;
  }).join("");
  // คลิกแถว -> เทียบ supplier
  body.querySelectorAll("tr[data-item]").forEach(tr=>{
    tr.onclick=()=>showSupplierCompare(brand, tr.dataset.item, tr.dataset.name);
  });
}

async function showSupplierCompare(brand, itemId, itemName){
  const panel=document.getElementById("supCmpPanel");
  const body=document.getElementById("supCmpBody");
  document.getElementById("supCmpTitle").textContent=`เทียบราคา: ${itemId} ${itemName||''}`;
  panel.style.display="block";
  body.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">กำลังโหลด…</td></tr>`;
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
  try{
    const rows=await api(`/api/price/by-supplier?brand=${brand}&item_id=${encodeURIComponent(itemId)}`);
    if(!rows.length){ body.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">ไม่มีข้อมูล</td></tr>`; return; }
    const minP=Math.min(...rows.map(r=>+r.avg_price));
    body.innerHTML=rows.map(r=>{
      const cheapest=(+r.avg_price===minP);
      return `<tr>
        <td>${r.vendor_name}${cheapest?' <span class="badge" style="background:var(--c5);color:#fff">ถูกสุด</span>':''}</td>
        <td class="num"><b>฿${fmtP(r.avg_price)}</b></td>
        <td class="num">฿${fmtP(r.min_price)}</td>
        <td class="num">฿${fmtP(r.max_price)}</td>
        <td class="num">${fmtN(r.buy_count)}</td>
        <td class="num">${r.last_buy||'-'}</td>
      </tr>`;
    }).join("");
  }catch(e){
    body.innerHTML=`<tr><td colspan="6" class="err">${e.message}</td></tr>`;
  }
}

initBrands();
</script>
